name: Deploy RAG MCP Azure

# This workflow builds and deploys the RAG MCP service to Azure Container Apps.
# 
# Security notes:
# - Uses AZURE_CREDENTIALS (Service Principal) for Azure CLI authentication
# - Uses ACR_USERNAME/ACR_PASSWORD for Docker registry access (admin account)
# 
# Future improvement: Migrate to OIDC federated authentication
# This would eliminate the need for long-lived secrets:
#   https://learn.microsoft.com/en-us/azure/active-directory/workload-identities/workload-identity-federation
# 
# To implement:
# 1. Create an Azure Entra ID app with federated credentials for this repo
# 2. Replace AZURE_CREDENTIALS with OIDC-based authentication
# 3. Use docker/login-action@v3 with OIDC for ACR authentication
# 4. Remove ACR admin account credentials

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP_NAME: rag-mcp-azure
  AZURE_RESOURCE_GROUP: rg-rag-mcp-azure
  AZURE_CONTAINERAPPS_ENVIRONMENT: cae-rag-mcp-azure
  # Match the existing ACA environment location in your subscription.
  # Verified value: France Central
  AZURE_LOCATION: francecentral
  ACR_NAME: ragmcpacr26
  IMAGE_NAME: rag-mcp-azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Add Container App extension
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --yes

      - name: Verify Container Apps environment exists
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
        with:
          inlineScript: |
            az containerapp env show \
              --name "${AZURE_CONTAINERAPPS_ENVIRONMENT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          BLOB_CONNECTION_STRING: ${{ secrets.BLOB_CONNECTION_STRING }}
        with:
          inlineScript: |
            set -x

            IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "Image: $IMAGE"
            echo "App Name: ${{ env.AZURE_CONTAINER_APP_NAME }}"
            echo "RG: ${{ env.AZURE_RESOURCE_GROUP }}"
            echo "Env: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}"

            if az containerapp show \
                 --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
                 --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                 -o none 2>/dev/null; then

              echo "Container App exists, updating..."

              az containerapp secret set \
                --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --secrets "blob-connection-string=${BLOB_CONNECTION_STRING}"

              az containerapp update \
                --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --image "$IMAGE" \
                --set-env-vars "BLOB_CONTAINER_URL=secretref:blob-connection-string"

            else

              echo "Container App does not exist, creating..."

              az containerapp create \
                --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --environment "${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}" \
                --image "$IMAGE" \
                --target-port 8000 \
                --ingress external \
                --registry-server "${{ env.ACR_NAME }}.azurecr.io" \
                --registry-username "${{ secrets.ACR_USERNAME }}" \
                --registry-password "${{ secrets.ACR_PASSWORD }}" \
                --secrets "blob-connection-string=${BLOB_CONNECTION_STRING}" \
                --env-vars "BLOB_CONTAINER_URL=secretref:blob-connection-string" \
                --cpu 0.5 \
                --memory 1.0Gi

            fi