name: Deploy RAG MCP Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP_NAME: rag-mcp-azure
  AZURE_RESOURCE_GROUP: rg-rag-mcp-azure
  AZURE_CONTAINERAPPS_ENVIRONMENT: cae-rag-mcp-azure
  # Match the existing ACA environment location in your subscription.
  # Verified value: France Central
  AZURE_LOCATION: francecentral
  ACR_NAME: ragmcpacr26
  IMAGE_NAME: rag-mcp-azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        run: |
          python -m compileall app

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Add Container App extension
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --yes

      - name: Verify Container Apps environment exists
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
        with:
          inlineScript: |
            az containerapp env show \
              --name "${AZURE_CONTAINERAPPS_ENVIRONMENT}" \
              --resource-group "${AZURE_RESOURCE_GROUP}"

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_SHA: ${{ github.sha }}
          AZURE_CONTAINER_APP_NAME: ${{ env.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          inlineScript: |
            set -x
            IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "Deploying image: $IMAGE"

            if az containerapp show \
                 --name "${AZURE_CONTAINER_APP_NAME}" \
                 --resource-group "${AZURE_RESOURCE_GROUP}" \
                 -o none 2>/dev/null; then
              echo "Container App exists, updating image..."
              az containerapp update \
                --name "${AZURE_CONTAINER_APP_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --image "$IMAGE" \
                --debug
            else
              echo "Container App does not exist, creating it..."
              az containerapp create \
                --name "${AZURE_CONTAINER_APP_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --location "${AZURE_LOCATION}" \
                --environment "${AZURE_CONTAINERAPPS_ENVIRONMENT}" \
                --image "$IMAGE" \
                --target-port 8000 \
                --ingress external \
                --registry-server "${ACR_NAME}.azurecr.io" \
                --registry-username "${ACR_USERNAME}" \
                --registry-password "${ACR_PASSWORD}" \
                --cpu 0.5 \
                --memory 1.0Gi \
                --debug
            fi
